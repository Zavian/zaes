    <script>
      // Apply the saved/system theme before first paint (mirrors src/ThemeContext.tsx)
      try {
        var saved = localStorage.getItem('zaes_theme');
        var dark = saved === 'dark' || (saved !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
